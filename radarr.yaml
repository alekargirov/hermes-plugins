tools:
  - name: radarr_library
    description: List all movies in the Radarr library (id, title, year, tmdbId, hasFile, monitored). Trimmed to essential fields so large libraries return complete and untruncated. Use the id field with radarr_delete to remove movies.
    group: arr
    method: GET
    url: "{env.RADARR_URL}/api/v3/movie"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"
    select: [id, title, year, tmdbId, hasFile, monitored]

  - name: radarr_search
    description: Search for a movie in Radarr (lookup, not library search). Matched against title.
    group: arr
    method: GET
    url: "{env.RADARR_URL}/api/v3/movie/lookup?term={arg.query}"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"
    args:
      query:
        type: string
        description: Movie title to search for
        required: true

  - name: radarr_add
    description: Add a movie to Radarr. Use radarr_search first to get tmdbId and titleSlug.
    group: arr
    method: POST
    url: "{env.RADARR_URL}/api/v3/movie"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"
    args:
      tmdbId:
        type: number
        description: TMDB id from radarr_search
        required: true
      title:
        type: string
        required: true
      titleSlug:
        type: string
        required: true
      qualityProfileId:
        type: number
        required: true
      rootFolderPath:
        type: string
        required: true
      monitored:
        type: boolean
        required: false

  - name: radarr_delete
    description: Delete a movie from Radarr by its id. Set deleteFiles=true to also remove files on disk. Get the id from radarr_library.
    group: arr
    method: DELETE
    url: "{env.RADARR_URL}/api/v3/movie/{arg.id}?deleteFiles={arg.deleteFiles|false}"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"
    args:
      id:
        type: number
        description: Radarr movie id (from radarr_library)
        required: true
      deleteFiles:
        type: boolean
        description: Also remove files on disk (default false)
        required: false

  - name: radarr_queue
    description: Get the Radarr download queue.
    group: arr
    method: GET
    url: "{env.RADARR_URL}/api/v3/queue?includeMovie=true"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"

  - name: radarr_wanted
    description: Get missing/wanted movies from Radarr.
    group: arr
    method: GET
    url: "{env.RADARR_URL}/api/v3/wanted/missing?pageSize=50"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"

  - name: radarr_rootfolder
    description: List Radarr root folders (id, path, accessible, freeSpace). Call before radarr_add to get a valid rootFolderPath (use the path value).
    group: arr
    method: GET
    url: "{env.RADARR_URL}/api/v3/rootfolder"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"
    select: [id, path, accessible, freeSpace]

  - name: radarr_qualityprofile
    description: List Radarr quality profiles (id, name). Call before radarr_add to get a valid qualityProfileId (use the id).
    group: arr
    method: GET
    url: "{env.RADARR_URL}/api/v3/qualityprofile"
    headers:
      X-Api-Key: "{env.RADARR_API_KEY}"
    select: [id, name]
