# recipe-srv tools — group `recipes`. Ships ALONGSIDE the old pica-backed
# recipes.yaml (group `recipes`); at prod cutover the old file is deleted and
# this group is renamed to `recipes`. Backed by recipe-srv's REST API
# (RECIPES_URL, default http://recipes:3019). No auth — single-user LAN app;
# X-User-Id is sent for the gate's audit line only. Every write returns the
# resulting object. rawText is authoritative: a tool fills the parsed fields
# around an ingredient line, never over it.
tools:
  # ── reads ──
  - name: recipes_list
    group: recipes
    description: List recipes (id, slug, title, image). Optionally filter by a tag slug.
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes?tag={arg.tag}&limit={arg.limit}"
    headers:
      X-User-Id: "{user.id}"
    args:
      tag:
        type: string
        description: Tag or cuisine slug to filter by (e.g. "balkan", "soup"). Omit for all.
        required: false
      limit:
        type: number
        description: Max recipes (default 500)
        required: false

  - name: recipes_get
    group: recipes
    description: Full recipe by slug — fields, ingredients (with parsed qty/unit/name and the raw line), steps, tags.
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/get?slug={arg.slug}"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug:
        type: string
        description: Recipe slug (from recipes_list / recipes_search)
        required: true

  - name: recipes_search
    group: recipes
    description: Full-text search over titles, ingredients AND steps. "star anise" finds recipes where it is only an ingredient.
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/search?q={arg.q}&limit={arg.limit}"
    headers:
      X-User-Id: "{user.id}"
    args:
      q:
        type: string
        description: Search query
        required: true
      limit:
        type: number
        description: Max results (default 50)
        required: false

  - name: recipes_by_ingredients
    group: recipes
    description: >-
      The fridge query — "what can I make with what I have". Returns recipes that
      contain EVERY listed ingredient term (AND match over ingredient text).
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/by-ingredients?have={arg.have}&limit={arg.limit}"
    headers:
      X-User-Id: "{user.id}"
    args:
      have:
        type: string
        description: Comma-separated ingredients you have, e.g. "chicken,ginger,star anise"
        required: true
      limit:
        type: number
        description: Max results (default 50)
        required: false

  - name: recipes_unparsed
    group: recipes
    description: >-
      Ingredients the importer could not fully structure (empty name, or a line
      that starts with a number but no quantity was captured). The starting point
      for tidying free-form ingredients into fields. Returns ingredient id +
      recipe slug/title + the raw line.
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/unparsed?limit={arg.limit}"
    headers:
      X-User-Id: "{user.id}"
    args:
      limit:
        type: number
        description: Max rows (default 200)
        required: false

  - name: recipes_raw
    group: recipes
    description: The original Paprika JSON payload for a recipe, exactly as imported (nothing lost on import lives here).
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/raw?slug={arg.slug}"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug:
        type: string
        description: Recipe slug
        required: true

  - name: recipes_tags
    group: recipes
    description: All tags and cuisines with recipe counts (name, slug, isCuisine, count).
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/tags"
    headers:
      X-User-Id: "{user.id}"

  - name: recipes_scale
    group: recipes
    description: A recipe's ingredients rewritten for N servings (read-only — nothing is saved). Returns original + scaled lines.
    method: GET
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/scale?slug={arg.slug}&servings={arg.servings}"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug:
        type: string
        description: Recipe slug
        required: true
      servings:
        type: number
        description: Target servings
        required: true

  # ── recipe writes ──
  - name: recipes_create
    group: recipes
    description: Create a new (empty) recipe with a title. Returns the new recipe incl. its slug.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/create"
    headers:
      X-User-Id: "{user.id}"
    args:
      title:
        type: string
        description: Recipe title
        required: true

  - name: recipes_field_set
    group: recipes
    description: >-
      Set recipe-level fields (only those provided change). Free-text prepText /
      cookText / servingsText re-derive their parsed numbers automatically.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/field-set"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }
      title: { type: string, required: false }
      notes: { type: string, required: false }
      sourceName: { type: string, required: false }
      sourceUrl: { type: string, required: false }
      difficulty: { type: string, required: false }
      rating: { type: number, required: false }
      nutritionalInfo: { type: string, required: false }
      prepText: { type: string, description: "e.g. \"20 minutes\"", required: false }
      cookText: { type: string, required: false }
      servingsText: { type: string, description: "e.g. \"Serves 4 to 6\"", required: false }
      servingsBase: { type: number, description: "Explicit scaler base, overrides the parse", required: false }

  - name: recipes_delete
    group: recipes
    description: Soft-delete a recipe (moves it to trash). Returns the row.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/delete"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }

  - name: recipes_restore
    group: recipes
    description: Restore a soft-deleted recipe from trash.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/restore"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }

  - name: recipes_upload_image
    group: recipes
    description: Download an image from a public URL and set it as the recipe's cover. Returns the updated recipe.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/recipes/upload-image"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }
      imageUrl: { type: string, description: Public image URL (jpg/png/gif/webp/avif), required: true }

  # ── ingredient writes ──
  - name: recipes_ingredient_add
    group: recipes
    description: Add an ingredient to a recipe from a raw line ("2 tbsp olive oil, warmed"); qty/unit/name/prep are parsed out. Returns the new ingredient.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/ingredient/add"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }
      rawText: { type: string, description: The ingredient line as written, required: true }
      groupName: { type: string, description: "Optional group, e.g. \"For the sauce\"", required: false }

  - name: recipes_ingredient_set
    group: recipes
    description: >-
      Update one ingredient by id. Editing rawText re-derives qty/unit/name/prep;
      passing an explicit field (qty/unit/name/preparation/groupName/sort) sets
      just that. rawText is never overwritten except by an explicit rawText edit.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/ingredient/set"
    headers:
      X-User-Id: "{user.id}"
    args:
      id: { type: number, description: Ingredient id (from recipes_get / recipes_unparsed), required: true }
      rawText: { type: string, required: false }
      qty: { type: string, required: false }
      unit: { type: string, required: false }
      name: { type: string, required: false }
      preparation: { type: string, required: false }
      groupName: { type: string, required: false }
      sort: { type: number, required: false }

  - name: recipes_ingredient_delete
    group: recipes
    description: Delete an ingredient by id.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/ingredient/delete"
    headers:
      X-User-Id: "{user.id}"
    args:
      id: { type: number, description: Ingredient id, required: true }

  - name: recipes_ingredients_set_group
    group: recipes
    description: Assign a group name to several ingredients at once (bucket them under "For the sauce" etc.). Returns the updated rows.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/ingredient/set-group"
    headers:
      X-User-Id: "{user.id}"
    args:
      ids: { type: array, description: Ingredient ids, required: true }
      groupName: { type: string, description: Group name to assign (empty string clears it), required: true }

  # ── step writes ──
  - name: recipes_step_add
    group: recipes
    description: Add a method step to a recipe. Returns the new step.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/step/add"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }
      body: { type: string, description: Step text, required: true }
      groupName: { type: string, description: "Optional section, e.g. \"For the sauce\"", required: false }

  - name: recipes_step_set
    group: recipes
    description: Update a step by id (body / groupName / sort).
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/step/set"
    headers:
      X-User-Id: "{user.id}"
    args:
      id: { type: number, description: Step id, required: true }
      body: { type: string, required: false }
      groupName: { type: string, required: false }
      sort: { type: number, required: false }

  - name: recipes_step_delete
    group: recipes
    description: Delete a step by id.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/step/delete"
    headers:
      X-User-Id: "{user.id}"
    args:
      id: { type: number, description: Step id, required: true }

  - name: recipes_steps_reorder
    group: recipes
    description: Reorder a recipe's steps. Pass step ids in the new order; sort is renumbered.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/step/reorder"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }
      orderedIds: { type: array, description: Step ids in the desired order, required: true }

  # ── tag writes ──
  - name: recipes_tag_add
    group: recipes
    description: Add a tag (or cuisine) to a recipe. Creates the tag if new. Returns the tag.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/tag/add"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }
      name: { type: string, description: Tag name, required: true }
      isCuisine: { type: boolean, description: Mark this tag as a cuisine (default false), required: false }

  - name: recipes_tag_remove
    group: recipes
    description: Remove a tag from a recipe (by tag id, from recipes_get).
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/tag/remove"
    headers:
      X-User-Id: "{user.id}"
    args:
      slug: { type: string, description: Recipe slug, required: true }
      tagId: { type: number, description: Tag id, required: true }

  - name: recipes_tag_rename
    group: recipes
    description: Rename a tag (all recipes carrying it are affected). Identify it by slug.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/tag/rename"
    headers:
      X-User-Id: "{user.id}"
    args:
      tagSlug: { type: string, description: Slug of the tag to rename, required: true }
      name: { type: string, description: New display name, required: true }

  - name: recipes_tag_merge
    group: recipes
    description: >-
      Merge one tag into another — every recipe tagged `source` becomes tagged
      `target`, then `source` is deleted. Fixes duplicates like "Desert" -> "Dessert".
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/tag/merge"
    headers:
      X-User-Id: "{user.id}"
    args:
      source: { type: string, description: Slug of the tag to merge away, required: true }
      target: { type: string, description: Slug of the tag to keep, required: true }

  - name: recipes_tag_set_cuisine
    group: recipes
    description: Flag (or unflag) a tag as a cuisine, controlling whether it appears as a cuisine folder/facet.
    method: POST
    url: "{env.RECIPES_URL|http://recipes:3019}/api/v2/tag/set-cuisine"
    headers:
      X-User-Id: "{user.id}"
    args:
      tagSlug: { type: string, description: Slug of the tag, required: true }
      isCuisine: { type: boolean, description: true = cuisine, false = ordinary tag, required: true }
