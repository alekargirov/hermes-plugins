tools:
  - name: tmdb_search
    description: "Search movies or TV shows using TMDB. type: 'movie' or 'tv'."
    group: arr
    method: GET
    url: "https://api.themoviedb.org/3/search/{arg.type}?api_key={env.TMDB_API_KEY}&query={arg.query}"
    args:
      type:
        type: string
        description: "'movie' or 'tv'"
        required: true
      query:
        type: string
        description: Search query
        required: true

  - name: tmdb_get_details
    description: "Get movie or TV show details by TMDB ID. type: 'movie' or 'tv'."
    group: arr
    method: GET
    url: "https://api.themoviedb.org/3/{arg.type}/{arg.id}?api_key={env.TMDB_API_KEY}"
    args:
      type:
        type: string
        description: "'movie' or 'tv'"
        required: true
      id:
        type: number
        description: TMDB ID
        required: true

  - name: tmdb_get_credits
    description: "Get cast and crew credits for a movie or TV show by TMDB ID. type: 'movie' or 'tv'."
    group: arr
    method: GET
    url: "https://api.themoviedb.org/3/{arg.type}/{arg.id}/credits?api_key={env.TMDB_API_KEY}"
    args:
      type:
        type: string
        description: "'movie' or 'tv'"
        required: true
      id:
        type: number
        description: TMDB ID
        required: true

  - name: tmdb_get_popular
    description: "Get popular movies or TV shows from TMDB. type: 'movie' or 'tv'."
    group: arr
    method: GET
    url: "https://api.themoviedb.org/3/{arg.type}/popular?api_key={env.TMDB_API_KEY}&page={arg.page}"
    args:
      type:
        type: string
        description: "'movie' or 'tv'"
        required: true
      page:
        type: number
        description: Page number
        required: true

  - name: tmdb_get_top_rated
    description: Get top-rated movies from TMDB.
    group: arr
    method: GET
    url: "https://api.themoviedb.org/3/movie/top_rated?api_key={env.TMDB_API_KEY}&page={arg.page}"
    args:
      page:
        type: number
        description: Page number
        required: true
