tools:
  # Notes vault tools — backed by the notes-srv APP (notes.pica.win, v2 REST).
  # Cut over from the legacy home-srv file vault on 2026-07-20 (old backend retired).
  # Paths are app paths: "folder/Title" (NO .md extension).
  # Read access is open; writes are scoped by the app: X-API-Key = your
  # username = the top-level folder you may write under (v2 auth model).
  - name: notes_tree
    group: notes
    description: Full folder/file tree of the notes vault. Returns the whole tree; use notes_list to scope to one folder level.
    method: GET
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/tree"

  - name: notes_list
    group: notes
    description: List direct subfolders and notes at one folder level. Omit path for vault root.
    method: GET
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/folders/list?path={arg.path|}"
    args:
      path:
        type: string
        description: Folder path (e.g. "claude/conventions"). Empty = vault root.
        required: false

  - name: notes_read
    group: notes
    description: >-
      Read a note by path. Path is "folder/Title" — no .md extension (e.g.
      "claude/conventions/INDEX"). Returns the markdown AND every comment thread
      on it (see commentsText for a readable rendering). Comments are anchored by
      "^a1b2c3" markers in the content: KEEP those markers when you rewrite a
      note, they are what holds each comment to its paragraph.
    method: GET
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/notes/read?path={arg.path}"
    args:
      path:
        type: string
        description: Note path (folder/Title, no .md)
        required: true

  - name: notes_search
    group: notes
    description: Full-text search (case-insensitive substring over title+content) across the notes vault. Returns matching notes with full content.
    method: GET
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/notes/search?q={arg.q}"
    args:
      q:
        type: string
        description: Search query
        required: true

  - name: notes_write
    group: notes
    description: >-
      Create or update a note. Path must be under YOUR top-level folder (your
      username is the write key; e.g. claude/...). Content is a markdown string.
      Path is "folder/Title" — no .md. Preserve any "^a1b2c3" block markers the
      note came with: they anchor existing comments, and dropping them makes the
      server re-attach by matching text, or orphan the thread when it can't.
    method: POST
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/notes/write"
    headers:
      X-API-Key: "{user.username}"
      X-User-Id: "{user.id}"
    args:
      path:
        type: string
        description: Note path under your folder (e.g. "claude/apps/notes-srv/overview")
        required: true
      content:
        type: string
        description: Full note contents (markdown)
        required: true

  # ── Comments ──
  # Comments hang off a BLOCK ANCHOR: a "^a1b2c3" marker in the note's content.
  # notes_read returns them with the document, so no separate fetch is needed to
  # see them. Agents may REPLY to a thread but never open one — the app rejects
  # a reply on an anchor with no thread.
  - name: notes_comments
    group: notes
    description: List the comment threads on a note (anchors, comments, replies) without its content. notes_read already includes these — use this only when you want the threads alone.
    method: GET
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/notes/comments?path={arg.path}"
    args:
      path:
        type: string
        description: Note path, "folder/Title" — no .md
        required: true

  - name: notes_comment_reply
    group: notes
    description: >-
      Reply to a comment thread on a note. Pass the anchor exactly as notes_read
      shows it in brackets — "[^a1b2c3]" means anchor "a1b2c3". Your reply is
      attributed to you by name. You can only answer threads a human opened;
      replying on an anchor with no thread is rejected, and there is no way to
      start one.
    method: POST
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/notes/comments/reply"
    headers:
      X-API-Key: "{user.username}"
      X-User-Id: "{user.id}"
    args:
      path:
        type: string
        description: Note path, "folder/Title" — no .md
        required: true
      anchor:
        type: string
        description: Block anchor of the thread, without the caret (e.g. "a1b2c3")
        required: true
      body:
        type: string
        description: The reply text
        required: true

  - name: notes_delete
    group: notes
    description: Delete a note by path. Must be under your own top-level folder. Path is "folder/Title" — no .md.
    method: POST
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/notes/delete"
    headers:
      X-API-Key: "{user.username}"
      X-User-Id: "{user.id}"
    args:
      path:
        type: string
        description: Path of the note to delete
        required: true

  - name: notes_move
    group: notes
    description: Move or rename a note. Both paths must be under your own top-level folder. Paths are "folder/Title" — no .md.
    method: POST
    url: "{env.NOTES_URL|http://notes:3000}/api/v2/notes/move"
    headers:
      X-API-Key: "{user.username}"
      X-User-Id: "{user.id}"
    args:
      from:
        type: string
        description: Current path
        required: true
      to:
        type: string
        description: New path
        required: true
